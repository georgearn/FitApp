[project]
name = "fitapp"
version = "1.1.2"
description = "FitApp — mini Freeletics-style workout app (Flet)"
dependencies = [
    "flet==0.86.5",
    "flet-aicore @ file:///D:/Project/Claude%20outputs/workout%20app/fitapp/flet_aicore",
]

[tool.flet]
org = "com.georgearn"
product = "FitApp"

[tool.flet.android]
adaptive_icon_background = "#1565C0"
target_arch = ["arm64-v8a"]
min_sdk_version = 31  # Android 12 minimum — drops Android 8 (API 26) support

[tool.flet.app]
exclude = [".claude", ".flet", ".git", ".gitignore", ".idea", "__pycache__", "extras", "tools", "README.md", "requirements.txt"]
