name: flet_aicore
description: Flet Service wrapping ML Kit GenAI Prompt API (on-device Gemini Nano / AICore).
version: 0.1.0
homepage: https://github.com/georgearn/fitapp

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flet: ">=0.86.2"

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.georgearn.flet_aicore
        pluginClass: FletAicorePlugin
