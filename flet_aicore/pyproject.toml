[project]
name = "flet-aicore"
version = "0.1.0"
description = "Flet Service control wrapping ML Kit GenAI Prompt API (on-device Gemini Nano / AICore) for Android"
requires-python = ">=3.9"
dependencies = ["flet>=0.86.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flet_aicore"]

[tool.hatch.build.targets.wheel.force-include]
"src/flutter" = "flutter"
